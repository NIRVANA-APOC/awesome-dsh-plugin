url: https://github.com/NIRVANA-APOC/dsh-api-cost
name: NIRVANA-APOC/dsh-api-cost
category: usage
description:
  en: 'Session cost for the composer, priced against DeepSeek peak / off-peak rates with the 2025-2026 China statutory-holiday and makeup-workday calendar built in: a pill under the composer shows the running cost in CNY and USD and expands into the tier countdown, token buckets, per-model spend and in-flight calls; subagent and agent-team subsessions roll into the session that started them, and the first read of a conversation replays its session log (idempotent, keyed by turn:step) so an opened or resumed session already carries the calls that settled before the plugin loaded; /cost, a session_cost tool and a GET JSON snapshot expose the same figures.'
  zh: '输入框下方的会话成本：按 DeepSeek 峰谷价目表计价，内置 2025–2026 年中国法定节假日与调休日历；胶囊显示本会话 ¥/$ 花费，可展开时段倒计时、token 分桶、按模型拆分与进行中调用；子智能体与智能体团队的会话计入发起它的会话，首次读取某个会话时会自动重放它的日志（幂等，按 turn:step 记账），打开或重启后回到的会话已包含插件加载前结算的调用；并提供 /cost 命令、session_cost 工具与 GET JSON 快照。'
