url: https://github.com/NIRVANA-APOC/dsh-api-cost
name: NIRVANA-APOC/dsh-api-cost
category: usage
description:
  en: 'Composer-pill cost meter for DeepSeek peak / off-peak pricing: every model call is priced at settlement time (2025-2026 China holiday calendar built in) and shown in CNY and USD, expandable into the tier countdown, peak / off-peak totals, token buckets and per-model spend; subagent and agent-team subsessions roll into the session that started them, a recount replays the session logs for calls that settled before the plugin loaded, and /cost, a session_cost tool and a GET JSON snapshot expose the same figures.'
  zh: 'DeepSeek 峰谷计价的输入框胶囊：每次模型调用按结算时刻计价（内置 2025–2026 年中国法定节假日与调休日历），以 ¥/$ 显示本会话花费，可展开倒计时、峰谷分项、token 分桶与按模型拆分；子智能体与智能体团队的会话计入发起它的会话，「重新统计」重放会话日志补回插件加载前的调用，并有 /cost 命令、session_cost 工具与 GET JSON 快照。'
